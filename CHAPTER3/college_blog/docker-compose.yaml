services:
  db:
    image: postgres:15  
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: college_blog
      POSTGRES_USER: aryan
      POSTGRES_PASSWORD: 123456

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://aryan:123456@db:5432/college_blog
    depends_on:
      - db

volumes:
  postgres_data: