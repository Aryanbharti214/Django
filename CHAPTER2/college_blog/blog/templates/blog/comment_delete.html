{% extends "blog/base.html" %}
{% block title %}{{post.title}}{% endblock %}
{% block content %}
<h1>{{post.title}}</h1>

<form>
    {%for comment in comments%}
    <div class="comment">
        <p class="info">
            Comment {{forloop.counter}} by {{comment.name}}
            {{comment.created}}
        </p>
        <ul>
            <li>{{comment.body|linebreaks}}</li>
            <input type="checkbox" >
        </ul>
    </div>
    <button type="button" value="deleteSelected">DELETE</button>
</form>
